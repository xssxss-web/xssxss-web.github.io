name: Update Product Categories

on:
  push:
    branches:
      - main
    paths:
      - 'update_categories.py'
  workflow_dispatch:

jobs:
  update-categories:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run category update script
        run: python update_categories.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: batch update product categories"
          git push
