<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <span class="brand-name">{{ site.Title }}</span>
      <span class="brand-sub">{{ site.Params.slogan }}</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}" class="nav-link">{{ .Name }}</a>
      {{ end }}
      <details class="nav-drop">
        <summary class="nav-link">Categories</summary>
        <div class="drop-menu">
          {{ range sort site.Data.categories "priority" }}
            <a href="/categories/{{ .slug }}/">{{ .name }}</a>
          {{ end }}
        </div>
      </details>
    </nav>
    <a class="header-cta" href="https://wa.me/{{ replace (replace site.Params.whatsapp "+" "") "-" "" }}">WhatsApp</a>
  </div>
</header>
