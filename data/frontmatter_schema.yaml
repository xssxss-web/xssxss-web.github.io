fields:
  - csv_field: "branch_code"
    hugo_field: "branch_code"
    type: "string"
    group: "基础信息"
    visibility: "内部"
    purpose: "分公司识别，后续第二、第三分公司复用"
  - csv_field: "product_status"
    hugo_field: "product_status + draft"
    type: "string / bool"
    group: "基础信息"
    visibility: "内部"
    purpose: "控制页面是否发布"
  - csv_field: "sku"
    hugo_field: "sku"
    type: "string"
    group: "基础信息"
    visibility: "公开"
    purpose: "产品唯一编号、询盘识别"
  - csv_field: "product_name_en"
    hugo_field: "title"
    type: "string"
    group: "基础信息"
    visibility: "公开"
    purpose: "页面 H1、产品卡片标题、SEO标题来源"
  - csv_field: "product_name_cn"
    hugo_field: "product_name_cn"
    type: "string"
    group: "基础信息"
    visibility: "内部/可公开"
    purpose: "中文识别、内部采购沟通"
  - csv_field: "slug"
    hugo_field: "slug"
    type: "string"
    group: "基础信息"
    visibility: "公开"
    purpose: "URL路径"
  - csv_field: "category"
    hugo_field: "categories"
    type: "list"
    group: "分类"
    visibility: "公开"
    purpose: "Hugo taxonomy、类目页、导航聚合"
  - csv_field: "subcategory"
    hugo_field: "subcategory"
    type: "string"
    group: "分类"
    visibility: "公开"
    purpose: "二级分类、筛选或面包屑扩展"
  - csv_field: "tags"
    hugo_field: "tags"
    type: "list"
    group: "分类"
    visibility: "公开"
    purpose: "标签页、相关产品、SEO语义"
  - csv_field: "target_buyers"
    hugo_field: "buyers"
    type: "list"
    group: "客户"
    visibility: "公开"
    purpose: "目标买家分类和AI语义"
  - csv_field: "use_cases"
    hugo_field: "usecases"
    type: "list"
    group: "客户"
    visibility: "公开"
    purpose: "使用场景、GEO语义、内容模块"
  - csv_field: "short_summary_en"
    hugo_field: "summary"
    type: "string"
    group: "内容"
    visibility: "公开"
    purpose: "产品卡片摘要、页面开头短介绍"
  - csv_field: "description_en"
    hugo_field: "long_description + Markdown正文"
    type: "string / body"
    group: "内容"
    visibility: "公开"
    purpose: "产品长描述，既入 frontmatter 也写入正文"
  - csv_field: "selling_points"
    hugo_field: "selling_points"
    type: "list"
    group: "内容"
    visibility: "公开"
    purpose: "产品卖点列表"
  - csv_field: "material"
    hugo_field: "material"
    type: "string"
    group: "规格"
    visibility: "公开"
    purpose: "材质参数"
  - csv_field: "color_options"
    hugo_field: "color_options"
    type: "string/list"
    group: "规格"
    visibility: "公开"
    purpose: "颜色选项"
  - csv_field: "size_cm"
    hugo_field: "size_cm"
    type: "string"
    group: "规格"
    visibility: "公开"
    purpose: "产品尺寸，单位 cm"
  - csv_field: "weight_g"
    hugo_field: "weight_g"
    type: "number"
    group: "规格"
    visibility: "公开"
    purpose: "产品重量，单位 g"
  - csv_field: "packing"
    hugo_field: "packing"
    type: "string"
    group: "包装物流"
    visibility: "公开"
    purpose: "单品包装/装箱方式"
  - csv_field: "carton_qty_pcs"
    hugo_field: "carton_qty_pcs"
    type: "number"
    group: "包装物流"
    visibility: "公开"
    purpose: "每箱数量，单位 pcs"
  - csv_field: "carton_size_cm"
    hugo_field: "carton_size_cm"
    type: "string"
    group: "包装物流"
    visibility: "公开"
    purpose: "外箱尺寸，单位 cm"
  - csv_field: "carton_gw_kg"
    hugo_field: "carton_gw_kg"
    type: "number"
    group: "包装物流"
    visibility: "公开"
    purpose: "外箱毛重，单位 kg"
  - csv_field: "carton_nw_kg"
    hugo_field: "carton_nw_kg"
    type: "number"
    group: "包装物流"
    visibility: "公开"
    purpose: "外箱净重，单位 kg"
  - csv_field: "moq_pcs"
    hugo_field: "moq_pcs"
    type: "number"
    group: "批发交易"
    visibility: "公开"
    purpose: "最小起订量，单位 pcs"
  - csv_field: "price_min_usd"
    hugo_field: "price_min_usd"
    type: "number"
    group: "批发交易"
    visibility: "可公开/可隐藏"
    purpose: "最低参考价，单位 USD"
  - csv_field: "price_max_usd"
    hugo_field: "price_max_usd"
    type: "number"
    group: "批发交易"
    visibility: "可公开/可隐藏"
    purpose: "最高参考价，单位 USD"
  - csv_field: "sample_available"
    hugo_field: "sample_available"
    type: "bool"
    group: "批发交易"
    visibility: "公开"
    purpose: "是否支持样品"
  - csv_field: "sample_fee_usd"
    hugo_field: "sample_fee_usd"
    type: "number"
    group: "批发交易"
    visibility: "可公开"
    purpose: "样品费，单位 USD"
  - csv_field: "lead_time_days"
    hugo_field: "lead_time_days"
    type: "string/number"
    group: "批发交易"
    visibility: "公开"
    purpose: "交期，单位 days"
  - csv_field: "mixed_order_supported"
    hugo_field: "mixed_order_supported"
    type: "bool"
    group: "批发交易"
    visibility: "公开"
    purpose: "是否支持混批"
  - csv_field: "customization_options"
    hugo_field: "customization_options"
    type: "string"
    group: "批发交易"
    visibility: "公开"
    purpose: "定制能力"
  - csv_field: "certifications"
    hugo_field: "certifications"
    type: "string/list"
    group: "合规"
    visibility: "公开"
    purpose: "证书或检测"
  - csv_field: "main_image"
    hugo_field: "main_image"
    type: "string"
    group: "素材"
    visibility: "公开"
    purpose: "主图路径"
  - csv_field: "gallery_images"
    hugo_field: "gallery_images"
    type: "list"
    group: "素材"
    visibility: "公开"
    purpose: "产品图库"
  - csv_field: "image_alt_en"
    hugo_field: "image_alt"
    type: "string"
    group: "素材"
    visibility: "公开"
    purpose: "图片 alt，SEO和无障碍文本"
  - csv_field: "video_url"
    hugo_field: "video_url"
    type: "string"
    group: "素材"
    visibility: "公开"
    purpose: "视频链接"
  - csv_field: "meta_title"
    hugo_field: "meta_title"
    type: "string"
    group: "SEO"
    visibility: "公开"
    purpose: "自定义SEO标题"
  - csv_field: "meta_description"
    hugo_field: "description"
    type: "string"
    group: "SEO"
    visibility: "公开"
    purpose: "页面 meta description 和 Open Graph 描述"
  - csv_field: "primary_keyword"
    hugo_field: "primary_keyword"
    type: "string"
    group: "SEO"
    visibility: "公开"
    purpose: "主关键词"
  - csv_field: "secondary_keywords"
    hugo_field: "secondary_keywords"
    type: "list"
    group: "SEO"
    visibility: "公开"
    purpose: "辅助关键词"
  - csv_field: "faq_1_q"
    hugo_field: "faq[0].question"
    type: "string"
    group: "FAQ/GEO"
    visibility: "公开"
    purpose: "第1个FAQ问题"
  - csv_field: "faq_1_a"
    hugo_field: "faq[0].answer"
    type: "string"
    group: "FAQ/GEO"
    visibility: "公开"
    purpose: "第1个FAQ答案"
  - csv_field: "faq_2_q"
    hugo_field: "faq[1].question"
    type: "string"
    group: "FAQ/GEO"
    visibility: "公开"
    purpose: "第2个FAQ问题"
  - csv_field: "faq_2_a"
    hugo_field: "faq[1].answer"
    type: "string"
    group: "FAQ/GEO"
    visibility: "公开"
    purpose: "第2个FAQ答案"
  - csv_field: "related_skus"
    hugo_field: "related_skus"
    type: "list"
    group: "关联"
    visibility: "公开"
    purpose: "相关产品推荐"
  - csv_field: "supplier_name"
    hugo_field: "supplier.name"
    type: "string"
    group: "供应链"
    visibility: "内部"
    purpose: "供应商名称"
  - csv_field: "supplier_contact"
    hugo_field: "supplier.contact"
    type: "string"
    group: "供应链"
    visibility: "内部"
    purpose: "供应商联系方式"
  - csv_field: "market_location"
    hugo_field: "supplier.market_location"
    type: "string"
    group: "供应链"
    visibility: "内部"
    purpose: "市场位置/摊位"
  - csv_field: "supplier_type"
    hugo_field: "supplier.type"
    type: "string"
    group: "供应链"
    visibility: "内部"
    purpose: "工厂/档口/贸易商"
  - csv_field: "source_cost_rmb"
    hugo_field: "supplier.source_cost_rmb"
    type: "number"
    group: "供应链"
    visibility: "内部"
    purpose: "采购成本，单位 RMB"
  - csv_field: "quality_notes"
    hugo_field: "quality_notes"
    type: "string"
    group: "风控"
    visibility: "内部"
    purpose: "质量备注"
  - csv_field: "risk_notes"
    hugo_field: "risk_notes"
    type: "string"
    group: "风控"
    visibility: "内部"
    purpose: "风险备注"
  - csv_field: "last_updated"
    hugo_field: "last_updated"
    type: "date"
    group: "运营"
    visibility: "内部/可公开"
    purpose: "内容更新时间"
  - csv_field: "internal_notes"
    hugo_field: "internal_notes"
    type: "string"
    group: "运营"
    visibility: "内部"
    purpose: "内部运营备注"
